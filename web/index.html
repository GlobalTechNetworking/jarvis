<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#050508" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>DEV — Arquiteto de Inovação</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{--gold:#c9a227;--cyan:#00d4ff;--bg:#050508;--panel:rgba(12,14,20,.75);--border:rgba(201,162,39,.35);--text:#e8eef5;--muted:#8b95a8;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:IBM Plex Sans,system-ui,sans-serif}
#c{position:fixed;inset:0;touch-action:none}
.hud{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;padding:calc(12px + var(--safe-t)) 14px calc(12px + var(--safe-b));pointer-events:none}
.hud>*{pointer-events:auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.name{font-family:Orbitron,sans-serif;font-weight:700;letter-spacing:.18em;color:var(--gold);font-size:1.05rem}
.sub{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:999px;border:1px solid var(--border);background:var(--panel);color:var(--gold);backdrop-filter:blur(10px)}
.pill.on{border-color:rgba(0,212,255,.45);color:var(--cyan)}
.spacer{flex:1}
.panel{width:min(520px,100%);margin:0 auto;display:flex;flex-direction:column;gap:10px}
.bubble{padding:12px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--border);backdrop-filter:blur(12px);font-size:.92rem;line-height:1.45}
.bubble b{display:block;font-family:Orbitron,sans-serif;font-size:.72rem;letter-spacing:.12em;color:var(--gold);margin-bottom:4px}
.row{display:flex;gap:8px;align-items:center;padding:8px;border-radius:999px;background:var(--panel);border:1px solid var(--border);backdrop-filter:blur(14px)}
.row input{flex:1;min-width:0;border:0;outline:none;background:transparent;color:var(--text);font-size:.95rem;padding:8px 10px}
.row input::placeholder{color:var(--muted)}
.btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--border);background:rgba(201,162,39,.12);color:var(--gold);display:grid;place-items:center;flex-shrink:0;cursor:pointer}
.btn.live{background:rgba(0,212,255,.22);border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 16px rgba(0,212,255,.35)}
.btn svg{width:20px;height:20px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
<div class="top"><div><div class="name">DEV</div><div class="sub">Arquiteto de inovação</div></div>
<div class="pills"><span class="pill on" id="status">ONLINE</span><span class="pill">WEB</span></div></div>
<div class="spacer"></div>
<div class="panel">
<div class="bubble"><b>DEV</b><span id="reply">Núcleo holográfico online. Eu sou o DEV — arquiteto de inovação. Fale comigo por texto ou voz.</span></div>
<form class="row" id="form">
<input id="input" placeholder="Fale com o DEV…" autocomplete="off" enterkeyhint="send" />
<button type="button" class="btn" id="mic" aria-label="Microfone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v3"/></svg></button>
<button type="submit" class="btn" aria-label="Enviar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13"/><path d="M22 2 15 22 11 13 2 9 22 2Z"/></svg></button>
</form></div></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.170.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
const canvas=document.getElementById("c");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x050508,1);
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x050508,6,14);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,50);
camera.position.set(0,0.15,3.35);
const controls=new OrbitControls(camera,canvas);
controls.enablePan=false;controls.minDistance=2.3;controls.maxDistance=5;
controls.maxPolarAngle=Math.PI*0.58;controls.minPolarAngle=Math.PI*0.32;
controls.target.set(0,0.1,0);controls.update();
scene.add(new THREE.AmbientLight(0xffffff,0.5));
const key=new THREE.DirectionalLight(0xfff4d6,1.1);key.position.set(4,6,3);scene.add(key);
const cyan=new THREE.PointLight(0x00d4ff,1.6,20);cyan.position.set(-3,2,-2);scene.add(cyan);
const goldL=new THREE.PointLight(0xc9a227,0.9,20);goldL.position.set(2,-1,3);scene.add(goldL);
function makeBinaryTex(){const s=512,c=document.createElement("canvas");c.width=c.height=s;const ctx=c.getContext("2d");ctx.fillStyle="#000";ctx.fillRect(0,0,s,s);ctx.fillStyle="#c9a227";ctx.font="28px monospace";for(let y=0;y<s;y+=32)for(let x=0;x<s;x+=22)ctx.fillText((x+y)%2?"1":"0",x,y+24);const tex=new THREE.CanvasTexture(c);tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(2,1);return tex}
const ringGroup=new THREE.Group();ringGroup.position.y=0.15;
const binTex=makeBinaryTex();
const ring1=new THREE.Mesh(new THREE.TorusGeometry(1.55,0.016,12,96),new THREE.MeshBasicMaterial({map:binTex,transparent:true,opacity:0.55,toneMapped:false}));
ring1.rotation.x=Math.PI/2.1;ring1.rotation.y=0.15;
const ring2=new THREE.Mesh(new THREE.TorusGeometry(1.85,0.012,12,96),new THREE.MeshBasicMaterial({color:0x00d4ff,transparent:true,opacity:0.35,toneMapped:false}));
ring2.rotation.x=Math.PI/2.4;ring2.rotation.y=-0.2;
ringGroup.add(ring1,ring2);scene.add(ringGroup);
const pCount=50,pGeo=new THREE.BufferGeometry(),pPos=new Float32Array(pCount*3);
for(let i=0;i<pCount;i++){pPos[i*3]=(Math.random()-0.5)*6;pPos[i*3+1]=(Math.random()-0.5)*5;pPos[i*3+2]=(Math.random()-0.5)*4}
pGeo.setAttribute("position",new THREE.BufferAttribute(pPos,3));
const particles=new THREE.Points(pGeo,new THREE.PointsMaterial({color:0x00d4ff,size:0.04,transparent:true,opacity:0.55}));
scene.add(particles);
const portrait=new THREE.Group();
new THREE.TextureLoader().load("./dev-ref.jpg",tex=>{tex.colorSpace=THREE.SRGBColorSpace;const size=2.35;
const glow=new THREE.Mesh(new THREE.CircleGeometry(size*0.62,64),new THREE.MeshBasicMaterial({color:0x00d4ff,transparent:true,opacity:0.12,toneMapped:false}));glow.position.z=-0.05;
const img=new THREE.Mesh(new THREE.PlaneGeometry(size,size),new THREE.MeshBasicMaterial({map:tex,transparent:true,toneMapped:false,side:THREE.DoubleSide}));
portrait.add(glow,img);portrait.position.y=0.08;scene.add(portrait)});
let phase="online";const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();
const speed=phase==="speaking"?0.45:phase==="listening"?0.28:0.14;
if(portrait.children.length){portrait.rotation.y=Math.sin(t*speed)*0.2;portrait.position.y=0.08+Math.sin(t*1.15)*0.05}
ring1.rotation.z+=0.004;ring2.rotation.z-=0.0025;particles.rotation.y=t*0.03;controls.update();renderer.render(scene,camera)}
animate();
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const replyEl=document.getElementById("reply"),statusEl=document.getElementById("status"),input=document.getElementById("input"),form=document.getElementById("form"),micBtn=document.getElementById("mic");
function setPhase(p){phase=p;statusEl.textContent=p==="listening"?"OUVINDO":p==="speaking"?"FALANDO":"ONLINE";statusEl.classList.toggle("on",p!=="listening");micBtn.classList.toggle("live",p==="listening")}
function speak(text){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="pt-BR";u.rate=1.02;u.onstart=()=>setPhase("speaking");u.onend=()=>setPhase("online");speechSynthesis.speak(u)}
function localReply(msg){const t=msg.toLowerCase();if(/quem é você|quem e voce|seu nome/.test(t))return"Eu sou o DEV — arquiteto de inovação. Código flui pelos meus circuitos.";if(/olá|ola|oi|e aí|e ai/.test(t))return"Olá. Núcleo holográfico online. Como posso ajudar?";if(/hora/.test(t))return"Agora são "+new Date().toLocaleTimeString("pt-BR")+".";if(/obrigado|valeu/.test(t))return"Às ordens. Sempre que precisar, é só chamar.";return'Entendi: "'+msg+'". Estou em modo web local.';}
function handle(msg){const reply=localReply(msg);replyEl.textContent=reply;speak(reply)}
form.addEventListener("submit",e=>{e.preventDefault();const msg=input.value.trim();if(!msg)return;input.value="";handle(msg)});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
if(SR){rec=new SR();rec.lang="pt-BR";rec.continuous=false;rec.interimResults=false;rec.onresult=ev=>{const text=ev.results[0][0].transcript.trim();if(text)handle(text);setPhase("online")};rec.onerror=()=>setPhase("online");rec.onend=()=>setPhase("online")}else micBtn.style.display="none";
micBtn.addEventListener("click",()=>{if(!rec)return;if(phase==="listening"){rec.stop();setPhase("online");return}try{rec.start();setPhase("listening")}catch{setPhase("online")}});
</script>
</body>
</html>
